map $http_cf_connecting_ip $finquery_client_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

map $http_cf_connecting_ip $finquery_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $finquery_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $finquery_client_key zone=finquery_login:10m rate=5r/m;
limit_req_zone $finquery_client_key zone=finquery_query:10m rate=10r/m;
limit_req_zone $finquery_client_key zone=finquery_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api/auth/login {
        limit_req zone=finquery_login burst=3 nodelay;
        proxy_pass http://backend-public:8000;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /api/query {
        limit_req zone=finquery_query burst=3 nodelay;
        proxy_pass http://backend-public:8000;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /api/ {
        limit_req zone=finquery_api burst=40 nodelay;
        proxy_pass http://backend-public:8000;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
