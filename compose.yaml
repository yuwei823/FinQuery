name: finquery

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      TRADE_DATA_ROOT: /data/raw
      CURATED_DATA_ROOT: /data/curated
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - type: bind
        source: ${TRADE_DATA_HOST_PATH:-D:/trade_data}
        target: /data/raw
        read_only: true
      - type: bind
        source: ${TRADE_DATA_CURATED_HOST_PATH:-D:/trade_data_curated}
        target: /data/curated
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  backend-public:
    profiles: ["public-preview"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      FINQUERY_PUBLIC_MODE: "true"
      ENABLE_GUEST: ${ENABLE_GUEST:-false}
      GUEST_DAILY_QUERY_LIMIT: "5"
      GUEST_USAGE_PATH: /data/runtime/guest_usage.db
      FINQUERY_ADMIN_PASSWORD: ${FINQUERY_ADMIN_PASSWORD:-}
      FINQUERY_MARKET_PASSWORD: ${FINQUERY_MARKET_PASSWORD:-}
      TRADE_DATA_ROOT: /data/raw
      CURATED_DATA_ROOT: /data/curated
    volumes:
      - type: bind
        source: ${TRADE_DATA_HOST_PATH:-D:/trade_data}
        target: /data/raw
        read_only: true
      - type: bind
        source: ${TRADE_DATA_CURATED_HOST_PATH:-D:/trade_data_curated}
        target: /data/curated
        read_only: true
      - guest_runtime:/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  stock-daily-data-prep:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - python
      - scripts/stock_daily_pipeline.py
      - convert
      - --source
      - /data/raw/stock-trading-data-pro
      - --output
      - /data/curated/trade_data
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ${TRADE_DATA_HOST_PATH:-D:/trade_data}
        target: /data/raw
        read_only: true
      - type: bind
        source: ${TRADE_DATA_CURATED_HOST_PATH:-D:/trade_data_curated}
        target: /data/curated

  index-daily-data-prep:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - python
      - scripts/index_daily_pipeline.py
      - convert
      - --source
      - /data/raw/stock-main-index-data
      - --output
      - /data/curated/trade_data
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ${TRADE_DATA_HOST_PATH:-D:/trade_data}
        target: /data/raw
        read_only: true
      - type: bind
        source: ${TRADE_DATA_CURATED_HOST_PATH:-D:/trade_data_curated}
        target: /data/curated

  financial-statement-data-prep:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - python
      - scripts/financial_statement_pipeline.py
      - convert
      - --source
      - /data/raw/stock-fin-data-xbx
      - --output
      - /data/curated/trade_data
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ${TRADE_DATA_HOST_PATH:-D:/trade_data}
        target: /data/raw
        read_only: true
      - type: bind
        source: ${TRADE_DATA_CURATED_HOST_PATH:-D:/trade_data_curated}
        target: /data/curated


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  public-gateway:
    profiles: ["public-preview"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: public-preview
    ports:
      - "127.0.0.1:${PUBLIC_PREVIEW_PORT:-8080}:80"
    depends_on:
      backend-public:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  cloudflared:
    profiles: ["public-preview"]
    image: cloudflare/cloudflared:2026.9.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TUNNEL_LOGLEVEL: info
    depends_on:
      public-gateway:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  frontend_node_modules:
  guest_runtime:
