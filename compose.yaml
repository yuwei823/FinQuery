name: finquery

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - type: bind
        source: ${TRADE_DATA_HOST_PATH:-D:/trade_data}
        target: /data/raw
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_node_modules:
